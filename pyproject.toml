[project]
name = "tls-evidence-rag"
version = "0.1.0"
description = "Russian evidence retrieval over historical TLS specifications"
requires-python = ">=3.11,<3.14"
dependencies = ["numpy==2.2.6", "onnxruntime==1.23.2", "tokenizers==0.22.2"]

[project.scripts]
tls-rag = "tls_rag.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tls_rag"]
